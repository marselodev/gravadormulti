name: Gravador Kick para YouTube

on:
  schedule:
    # Roda a cada 15 minutos, entre 14:00 e 22:59 (Horário de Brasília)
    - cron: '*/15 17-23,0-1 * * *'
  workflow_dispatch:

concurrency:
  group: gravacao
  cancel-in-progress: true

jobs:
  gravar_e_enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Fuso Horário Brasil
        run: sudo timedatectl set-timezone America/Sao_Paulo

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependências (Streamlink e YouTube Upload)
        run: |
          python -m pip install --upgrade pip
          pip install streamlink google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Restaurar Credenciais do YouTube
        run: |
          mkdir -p ~/.config/youtube-upload
          cat << 'EOF' > client_secrets.json
          ${{ secrets.YOUTUBE_CLIENT_SECRETS }}
          EOF
          
          cat << 'EOF' > request_token.json
          ${{ secrets.YOUTUBE_TOKEN }}
          EOF

      - name: Gravar Vídeo da Live
        id: gravacao
        run: |
          echo "Checando se o canal snopey está ao vivo na Kick..."
          DATA=$(date +%d-%m-%Y)
          NOME_ARQUIVO="live_snopey_${DATA}.mp4"
          
          if streamlink kick.com/snopey best --stream-url > /dev/null 2>&1; then
            echo "Canal online na Kick! Iniciando gravação..."
            streamlink kick.com/snopey best -o "$NOME_ARQUIVO"
            echo "gravou=true" >> $GITHUB_OUTPUT
            echo "arquivo=$NOME_ARQUIVO" >> $GITHUB_OUTPUT
            echo "data=$DATA" >> $GITHUB_OUTPUT
          else
            echo "Canal offline na Kick. Nenhuma gravação iniciada."
            echo "gravou=false" >> $GITHUB_OUTPUT
          fi

      - name: Script Python para Envio ao YouTube
        if: steps.gravacao.outputs.gravou == 'true'
        env:
          ARQUIVO_VIDEO: ${{ steps.gravacao.outputs.arquivo }}
          DATA_LIVE: ${{ steps.gravacao.outputs.data }}
        run: |
          cat << 'EOF' > upload.py
          import os
          import sys
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          from google.oauth2.credentials import Credentials

          arquivo = os.environ.get("ARQUIVO_VIDEO")
          data = os.environ.get("DATA_LIVE")

          if not arquivo or not os.path.exists(arquivo):
              print("Arquivo de vídeo não encontrado.")
              sys.exit(1)

          # Carrega credenciais salvas
          creds = Credentials.from_authorized_user_file('request_token.json')
          youtube = build('youtube', 'v3', credentials=creds)

          body = {
              'snippet': {
                  'title': f'Live Snopey - {data}',
                  'description': 'Gravação automática da live transmitida na Kick.',
                  'tags': ['snopey', 'kick', 'live', 'gameplay'],
                  'categoryId': '20' # Categoria 20 = Gaming
              },
              'status': {
                  'privacyStatus': 'unlisted', # 'private', 'unlisted' (não listado) ou 'public'
                  'selfDeclaredMadeForKids': False
              }
          }

          media = MediaFileUpload(arquivo, chunksize=-1, resumable=True, mimetype='video/mp4')

          print(f"Iniciando o envio de {arquivo} para o YouTube...")
          request = youtube.videos().insert(
              part=','.join(body.keys()),
              body=body,
              media_body=media
          )

          response = None
          while response is None:
              status, response = request.next_chunk()
              if status:
                  print(f"Progresso do Upload: {int(status.progress() * 100)}%")

          print(f"Upload concluído com sucesso! ID do Vídeo: {response['id']}")
          EOF

          python upload.py

      - name: Limpar Arquivos
        if: always()
        run: |
          rm -f *.mp4 client_secrets.json request_token.json upload.py
