name: Gravador

on:
  schedule:
    # Roda a cada 15 minutos, entre 14:00 e 22:59 (Horário de Brasília)
    - cron: '*/15 17-23,0-1 * * *'
  workflow_dispatch:

concurrency:
  group: gravacao
  cancel-in-progress: true

jobs:
  gravar_e_enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Fuso Horário Brasil
        run: sudo timedatectl set-timezone America/Sao_Paulo

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependências (Streamlink e Google API)
        run: |
          python -m pip install --upgrade pip
          pip install streamlink google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Restaurar Credenciais do YouTube
        run: |
          mkdir -p ~/.config/youtube-upload
          cat << 'EOF' > client_secrets.json
          ${{ secrets.YOUTUBE_CLIENT_SECRETS }}
          EOF
          
          cat << 'EOF' > request_token.json
          ${{ secrets.YOUTUBE_TOKEN }}
          EOF

      - name: Checar e Gravar Live (Kick ou Twitch)
        id: gravacao
        run: |
          DATA=$(date +%d-%m-%Y)
          GRAVOU=false
          ARQUIVO=""

          echo "Verificando se o canal snopey está ao vivo..."

          # 1. Checa a Kick
          if streamlink kick.com/snopey best --stream-url > /dev/null 2>&1; then
            echo "Canal ONLINE na Kick! Iniciando gravação..."
            ARQUIVO="snopey_kick_${DATA}.mp4"
            streamlink kick.com/snopey best -o "$ARQUIVO"
            GRAVOU=true

          # 2. Se não estiver na Kick, checa a Twitch
          elif streamlink twitch.tv/snopey best --stream-url > /dev/null 2>&1; then
            echo "Canal ONLINE na Twitch! Iniciando gravação..."
            ARQUIVO="snopey_twitch_${DATA}.mp4"
            streamlink twitch.tv/snopey best -o "$ARQUIVO"
            GRAVOU=true

          else
            echo "Canal OFFLINE na Kick e na Twitch. Nenhuma gravação iniciada."
          fi

          echo "gravou=$GRAVOU" >> $GITHUB_OUTPUT
          echo "arquivo=$ARQUIVO" >> $GITHUB_OUTPUT
          echo "data=$DATA" >> $GITHUB_OUTPUT

      - name: Enviar Vídeo para o YouTube
        if: steps.gravacao.outputs.gravou == 'true'
        env:
          ARQUIVO_VIDEO: ${{ steps.gravacao.outputs.arquivo }}
          DATA_LIVE: ${{ steps.gravacao.outputs.data }}
        run: |
          cat << 'EOF' > upload.py
          import os
          import sys
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          from google.oauth2.credentials import Credentials

          arquivo = os.environ.get("ARQUIVO_VIDEO")
          data = os.environ.get("DATA_LIVE")

          if not arquivo or not os.path.exists(arquivo):
              print("Arquivo de vídeo não encontrado para upload.")
              sys.exit(1)

          # Identifica a plataforma pelo nome do arquivo para o título
          plataforma = "Kick" if "kick" in arquivo else "Twitch"

          creds = Credentials.from_authorized_user_file('request_token.json')
          youtube = build('youtube', 'v3', credentials=creds)

          body = {
              'snippet': {
                  'title': f'Live Snopey ({plataforma}) - {data}',
                  'description': f'Gravação automática da live transmitida na {plataforma}.',
                  'tags': ['snopey', plataforma.lower(), 'live', 'gameplay'],
                  'categoryId': '20' # Categoria Gaming
              },
              'status': {
                  'privacyStatus': 'unlisted', # 'private', 'unlisted' ou 'public'
                  'selfDeclaredMadeForKids': False
              }
          }

          media = MediaFileUpload(arquivo, chunksize=-1, resumable=True, mimetype='video/mp4')

          print(f"Iniciando envio do vídeo {arquivo} para o YouTube...")
          request = youtube.videos().insert(
              part=','.join(body.keys()),
              body=body,
              media_body=media
          )

          response = None
          while response is None:
              status, response = request.next_chunk()
              if status:
                  print(f"Progresso do Upload: {int(status.progress() * 100)}%")

          print(f"Upload concluído com sucesso! ID do Vídeo: {response['id']}")
          EOF

          python upload.py

      - name: Limpar Arquivos
        if: always()
        run: |
          rm -f *.mp4 client_secrets.json request_token.json upload.py
